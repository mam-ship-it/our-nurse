<title>ممرّضنا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6f1;--card:#fff;--ink:#16302b;--mute:#6b7a76;--line:#e4e0d6;--brand:#0f766e;--dark:#0b3b36;--soft:#e6f2f0;--red:#b42318;--amber:#c97a1a;--tipbg:#fffaf0}
[data-theme=dark]{--bg:#0f1a18;--card:#172623;--ink:#e6efed;--mute:#97aaa6;--line:#2a3d39;--soft:#1d3a35;--brand:#2bb3a1;--tipbg:#2a2616}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700;color:inherit;background:none}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label{display:block;font-size:14px;margin:10px 0 4px;font-weight:500}
.hide{display:none!important}
#shell{display:flex;min-height:100vh}
nav{width:230px;background:var(--dark);color:#cfe3df;padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0;overflow:auto}
nav .brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
nav .brand b{display:block;color:#fff;font-size:18px}nav .brand small{font-size:12px}
nav a{display:block;padding:11px 12px;border-radius:10px;color:inherit;text-decoration:none;font-size:15px;margin-bottom:2px}
nav a.on,nav a:hover{background:#ffffff1f;color:#fff}
main{flex:1;min-width:0;padding:0 20px 30px;max-width:960px}
.topbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:4}
.topbar .sp{flex:1}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:14px;font-weight:700}
.chip b{color:var(--brand)}
@media(max-width:800px){#shell{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px;align-items:center}nav .brand{display:none}nav a{white-space:nowrap;margin:0}.topbar{top:48px}}
.hero{background:linear-gradient(135deg,#0b3b36,#13907f);color:#fff;border-radius:20px;padding:24px;margin-bottom:22px}
.hero h1{margin:8px 0 6px;font-size:34px}.hero p{margin:0 0 16px;opacity:.9;max-width:520px}
.pill{display:inline-block;background:#ffffff26;padding:4px 12px;border-radius:20px;font-size:12px}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.hstats div{background:#ffffff1f;border-radius:12px;padding:12px;text-align:center}.hstats b{display:block;font-size:28px}.hstats span{font-size:12px}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:14px}.ph .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.ph h2{margin:0;font-size:24px}.ph p{margin:2px 0 0;color:var(--mute);font-size:14px}
h2{font-size:19px;margin:0 0 12px}h3{margin:0 0 6px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid .card{margin:0}
a.tile{display:block;text-decoration:none;color:inherit}a.tile p{margin:0;color:var(--mute);font-size:14px}
.btn{background:var(--brand);color:#fff}.btn:hover{filter:brightness(.9)}.btn.full{width:100%;margin-top:12px}.btn.amber{background:var(--amber)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;color:var(--mute);font-weight:500}.tabs button.on{background:var(--brand);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:14px}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips button.amb.on{background:var(--amber);border-color:var(--amber)}
.sk{display:inline-block;background:var(--soft);border-radius:8px;padding:3px 10px;font-size:13px;margin:3px 0 3px 4px}
.badge{background:var(--brand);color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.dh{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}.dh small{display:block;color:var(--mute);direction:ltr;text-align:start}
.tag{background:var(--soft);color:var(--brand);border-radius:8px;padding:2px 10px;font-size:12px;font-weight:700;display:inline-block}
.tip{background:var(--tipbg);border:1px solid #f3e2b8;border-radius:10px;padding:10px;font-size:14px;margin-top:10px}
.res{background:var(--soft);border-radius:12px;padding:16px;margin-top:12px;font-weight:700;text-align:center;font-size:20px}
.res small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.msg{padding:10px;border-radius:10px;margin-top:10px;font-size:14px}.err{background:#fdeceb;color:var(--red)}.ok{background:var(--soft)}
.num{display:flex;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}.num b{color:var(--red);font-size:20px}
.emer{border-color:#f1b8b3;background:#fdf1f0}[data-theme=dark] .emer{background:#2c1b1a}
.dashed{border:1.5px dashed var(--line);border-radius:10px;padding:10px;color:var(--mute);font-size:13px;text-align:center;margin-top:8px}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:700}
ol,ul{margin:8px 0;padding-inline-start:22px;line-height:1.9}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);margin-top:8px;font-weight:500}
.opt.right{background:#d9f2e6;border-color:#2e9e6b;color:#0b3b36}.opt.wrong{background:#fdeceb;border-color:var(--red);color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chat{min-height:200px}.bub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;white-space:pre-wrap}.bub.me{background:var(--soft)}
.ahead{background:linear-gradient(135deg,#0b3b36,#13907f);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}.ahead h2{margin:0;color:#fff}.ahead p{margin:2px 0 0;opacity:.85;font-size:13px}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:20px;margin-top:14px;font-size:13px}
.sheet table{width:100%;border-collapse:collapse}.sheet td,.sheet th{border:1px solid #bbb;padding:6px;text-align:center}.sheet td:nth-child(2){text-align:start}
.sheet .hd{display:flex;gap:12px;align-items:center;border-bottom:2px solid #0f766e;padding-bottom:8px;margin-bottom:10px}
.sheet h4{margin:10px 0 4px;color:#0f766e}
#reg{max-width:440px;margin:0 auto;padding:24px 16px}
.sheet .rt td,.sheet .rt th{text-align:start!important;vertical-align:top}
.sheet table{margin-bottom:6px}.sheet th{background:#e6f2f0}
@media print{nav,.topbar,#reg{display:none!important}#view>*:not(.printable){display:none!important}#shell{display:block}main{padding:0;max-width:none}body{background:#fff}.printable{border:0!important;margin:0!important;padding:0!important}}
</style>
</head>
<body>
<div id="reg" class="hide">
  <img id="rlogo" width="90" height="90" style="border-radius:50%;display:block;margin:0 auto 10px" alt="">
  <h1 id="rt" style="text-align:center;margin:0"></h1>
  <p id="rsub" style="color:var(--mute);text-align:center"></p>
  <div class="card">
    <label id="l_rn"></label><input id="rn" autocomplete="name">
    <label id="l_rp"></label><input id="rp" type="tel" dir="ltr">
    <label id="l_rc"></label><input id="rc">
    <button class="btn full" id="rB"></button><div id="rM"></div>
  </div>
</div>
<div id="shell" class="hide">
  <nav id="nav"></nav>
  <main>
    <div class="topbar">
      <span class="chip">👥 <span id="vl"></span> <b id="vc">—</b></span>
      <span class="sp"></span>
      <button class="chip" id="lang"></button>
      <button class="chip" id="theme"></button>
    </div>
    <div id="view"></div>
  </main>
</div>

  const tabs=staff.role==="head"?["st_msgs","st_visit","st_report"]:["st_msgs","st_visit"];
  if(stTab>=tabs.length)stTab=0;
  hb.innerHTML=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>👤 <b>${esc(staff.name)}</b> <span class="tag">${staff.role==="head"?X("رئيس القسم","Head of Department"):X("مشرف امتياز","Internship supervisor")}</span></span><button class="chip" id="stout">${X("خروج","Sign out")}</button></div>`+tabsHTML(tabs,stTab)+'<div id="stbox"></div>';
  $("stout").onclick=()=>{staff=null;ss.set("staff","");hStaff(hb,v)};
  bindTabs(hb,i=>{stTab=i;hStaff(hb,v)});
  [stMsgs,stVisit,stReport][stTab]($("stbox"),v);
}
async function stMsgs(box){
  box.innerHTML=`<div class="msg ok">${X("جارٍ التحميل...","Loading...")}</div>`;
  let data;try{data=await rpc("staff_list_messages",{p_code:staff.code})}catch(e){box.innerHTML=errBox(e);if(!staff)setTimeout(()=>help($("view")),900);return}
  const draw=()=>{
    const L=data.filter(m=>stFilter==="all"||(stFilter==="open"?!m.reply:!!m.reply));
    const nOpen=data.filter(m=>!m.reply).length;
    box.innerHTML=`<div class="chips" id="sf" style="margin-bottom:12px"><button data-f="all" class="${stFilter==="all"?"on":""}">${t("all")} (${data.length})</button><button data-f="open" class="amb ${stFilter==="open"?"on":""}">${X("بانتظار الرد","Awaiting reply")} (${nOpen})</button><button data-f="done" class="${stFilter==="done"?"on":""}">${X("تم الرد","Replied")} (${data.length-nOpen})</button><button class="chip" id="rf2">⟳</button></div>`+
    (L.map(m=>`<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><b>${esc(m.student_name)}</b>${m.student_code?`<small dir="ltr" style="color:var(--mute)">${esc(m.student_code)}</small>`:""}<span class="tag">${kindLabel(m.kind)}</span>${m.hospital?`<span class="tag">📍 ${esc(m.hospital)}</span>`:""}<small style="color:var(--mute)">${fmtDT(m.created_at)}</small></div>
    ${m.subject?`<h3>${esc(m.subject)}</h3>`:""}${pre(m.body)}
    ${m.reply?`<div class="msg ok" style="margin-top:10px"><b>${X("رد: ","Reply by: ")}${esc(m.replied_by||"")}</b> <small style="color:var(--mute)">· ${fmtDT(m.replied_at)}</small>${pre(m.reply)}</div>`:
    `<label>${X("ردك على الطالب","Your reply to the student")}</label><textarea rows="3" data-r="${m.id}" maxlength="2000"></textarea><button class="btn full" data-send="${m.id}">${X("إرسال الرد باسم ","Send reply as ")}${esc(staff.name)}</button><div class="rm"></div>`}</div>`).join("")||`<div class="card" style="text-align:center;color:var(--mute)">${X("لا توجد رسائل.","No messages.")}</div>`);
    $("sf").onclick=e=>{const b=e.target.closest("button[data-f]");if(b){stFilter=b.dataset.f;draw()}};$("rf2").onclick=()=>stMsgs(box);
    box.querySelectorAll("[data-send]").forEach(b=>b.onclick=async()=>{const id=b.dataset.send,ta=box.querySelector(`[data-r="${id}"]`),txt=ta.value.trim(),rm=b.parentElement.querySelector(".rm");
      if(txt.length<2){rm.innerHTML=`<div class="msg err">${X("اكتب الرد.","Write the reply.")}</div>`;return}
      b.disabled=true;try{await rpc("staff_reply",{p_code:staff.code,p_id:id,p_doctor:staff.name,p_reply:txt});stMsgs(box)}catch(e){rm.innerHTML=errBox(e);b.disabled=false}});
  };draw();
}
async function stVisit(box){
  box.innerHTML=`<div class="card"><h3>🏥 ${X("تسجيل زيارة إشرافية","Log a supervisory visit")}</h3>
  <div class="row"><div><label>${X("المستشفى / المكان *","Hospital / place *")}</label><input id="vh" list="vl2">${placesList("vl2")}</div><div><label>${X("تاريخ الزيارة *","Visit date *")}</label><input id="vd" type="date" dir="ltr" value="${todayISO()}"></div></div>
  <label>${X("ماذا تم في الزيارة بالتحديد *","What exactly was done during the visit *")}</label><textarea id="va" rows="4" maxlength="3000"></textarea>
  <label>${X("المشاكل التي ظهرت","Problems that appeared")}</label><textarea id="vp" rows="3" maxlength="3000"></textarea>
  <label>${X("التوصيات / الإجراءات المطلوبة (اختياري)","Recommendations / required actions (optional)")}</label><textarea id="vr" rows="2" maxlength="2000"></textarea>
  <button class="btn full" id="vgo">${X("حفظ الزيارة","Save visit")}</button><div id="vm"></div></div><h2>${X("الزيارات المسجلة","Logged visits")}</h2><div id="vlist"><div class="msg ok">${X("جارٍ التحميل...","Loading...")}</div></div>`;
  const load=async()=>{try{const d=await rpc("staff_list_visits",{p_code:staff.code});
    $("vlist").innerHTML=d.map(x=>`<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><b>📍 ${esc(x.hospital)}</b><span class="tag">${fmtD(x.visit_date)}</span><small style="color:var(--mute)">${X("د. ","Dr. ")}${esc(x.doctor_name)}</small></div>
    <b style="font-size:14px">${X("ما تم:","Done:")}</b>${pre(x.activities)}${x.problems?`<b style="font-size:14px;color:var(--red)">${X("المشاكل:","Problems:")}</b>${pre(x.problems)}`:""}${x.recommendations?`<b style="font-size:14px">${X("التوصيات:","Recommendations:")}</b>${pre(x.recommendations)}`:""}</div>`).join("")||`<div class="card" style="text-align:center;color:var(--mute)">${X("لا توجد زيارات مسجلة.","No visits logged.")}</div>`}
    catch(e){$("vlist").innerHTML=errBox(e)}};load();
  $("vgo").onclick=async()=>{const h=$("vh").value.trim(),a=$("va").value.trim(),d=$("vd").value;
    if(!h||!a||!d){$("vm").innerHTML=`<div class="msg err">${X("المستشفى والتاريخ وما تم في الزيارة حقول مطلوبة.","Hospital, date and what was done are required.")}</div>`;return}
    $("vgo").disabled=true;try{await rpc("staff_add_visit",{p_code:staff.code,p_doctor:staff.name,p_hospital:h,p_date:d,p_activities:a,p_problems:$("vp").value.trim()||null,p_recs:$("vr").value.trim()||null});stVisit(box)}
    catch(e){$("vm").innerHTML=errBox(e);$("vgo").disabled=false}};
}
function stReport(box,v){
  box.innerHTML=`<div class="card"><h3>📑 ${X("تقرير رئيس القسم","Head of Department report")}</h3><p style="color:var(--mute);font-size:14px;margin-top:0">${X("يتضمن كل مشاكل وآراء واقتراحات الطلاب التي رد عليها المشرفون مع الردود، بالإضافة إلى الزيارات الإشرافية للمستشفيات والمشاكل التي ظهرت فيها.","Includes all student problems, opinions and suggestions that the supervisors replied to together with the replies, plus the supervisory hospital visits and the problems found in them.")}</p>
  <div class="row"><div><label>${X("من تاريخ (اختياري)","From date (optional)")}</label><input id="rfrom" type="date" dir="ltr"></div><div><label>${X("إلى تاريخ (اختياري)","To date (optional)")}</label><input id="rto" type="date" dir="ltr"></div></div>
  <button class="btn full" id="rgo">📑 ${X("إنشاء التقرير","Generate report")}</button><div id="rm3"></div></div>`;
  $("rgo").onclick=async()=>{$("rgo").disabled=true;
    try{const rep=await rpc("staff_report",{p_code:staff.code,p_from:$("rfrom").value||null,p_to:$("rto").value||null});showReport(v||$("view"),rep,$("rfrom").value,$("rto").value)}
    catch(e){$("rm3").innerHTML=errBox(e);$("rgo").disabled=false}};
}
function showReport(v,rep,from,to){
  const M=rep.messages||[],V=rep.visits||[],C=rep.counts||{};
  const hosp=[...new Set(V.map(x=>x.hospital))];
  const byKind=k=>M.filter(m=>m.kind===k).length;
  const per=from||to?`${from?fmtD(from):"…"} → ${to?fmtD(to):"…"}`:X("كل الفترات","All periods");
  v.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn" id="rprint">🖨 ${t("print")} / PDF</button><button class="chip" id="rback">← ${X("رجوع","Back")}</button></div>
  <div class="sheet printable" id="rsheet"><div class="hd"><img src="${LOGO}" width="56" height="56" style="border-radius:50%" alt=""><div><b>${X("المعهد الفني للتمريض — جامعة المنصورة","Technical Institute of Nursing — Mansoura University")}</b><br><small>${X("تقرير الإشراف على فترة الامتياز — مقدم لرئيس القسم","Internship supervision report — submitted to the Head of Department")}</small></div></div>
  <p>${X("الفترة:","Period:")} <b>${per}</b> · ${X("تاريخ إعداد التقرير:","Report date:")} <b>${fmtD(todayISO())}</b></p>
  <h4>${X("ملخص","Summary")}</h4><table><tr><th>${X("إجمالي رسائل الطلاب","Total student messages")}</th><th>${X("تم الرد عليها","Replied")}</th><th>${X("بانتظار الرد","Pending")}</th><th>${X("مشاكل","Problems")}</th><th>${X("آراء","Opinions")}</th><th>${X("اقتراحات","Suggestions")}</th><th>${X("الزيارات الإشرافية","Supervisory visits")}</th><th>${X("مستشفيات تمت زيارتها","Hospitals visited")}</th></tr>
  <tr><td>${C.total??0}</td><td>${M.length}</td><td>${C.pending??0}</td><td>${byKind("problem")}</td><td>${byKind("opinion")}</td><td>${byKind("suggestion")}</td><td>${V.length}</td><td>${hosp.length}</td></tr></table>
  <p style="font-size:12px;color:#555">${X("* الأنواع المعروضة (مشاكل / آراء / اقتراحات) تخص الرسائل التي تم الرد عليها فقط.","* The types shown (problems / opinions / suggestions) refer to replied messages only.")}</p>
  <h4>1. ${X("مشاكل الطلاب التي تم الرد عليها","Student issues that were replied to")}</h4>
  ${M.length?`<table class="rt"><tr><th>#</th><th>${X("الطالب","Student")}</th><th>${X("النوع / المكان","Type / place")}</th><th>${X("مشكلة / رأي الطالب","Student's problem / opinion")}</th><th>${X("رد المشرف","Supervisor's reply")}</th></tr>${M.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.student_name)}${m.student_code?`<br><small dir="ltr">${esc(m.student_code)}</small>`:""}<br><small>${fmtD(m.created_at)}</small></td><td>${kindLabel(m.kind)}${m.hospital?`<br><small>📍 ${esc(m.hospital)}</small>`:""}</td><td>${m.subject?`<b>${esc(m.subject)}</b><br>`:""}<span style="white-space:pre-wrap">${esc(m.body)}</span></td><td><b>${X("د. ","Dr. ")}${esc(m.replied_by||"")}</b> <small>(${fmtD(m.replied_at)})</small><br><span style="white-space:pre-wrap">${esc(m.reply)}</span></td></tr>`).join("")}</table>`:`<p>${X("لا توجد رسائل تم الرد عليها في هذه الفترة.","No replied messages in this period.")}</p>`}
  <h4>2. ${X("الزيارات الإشرافية للمستشفيات","Supervisory hospital visits")}</h4>
  ${V.length?`<table class="rt"><tr><th>#</th><th>${X("المستشفى / التاريخ","Hospital / date")}</th><th>${X("المشرف","Supervisor")}</th><th>${X("ما تم في الزيارة","What was done")}</th><th>${X("المشاكل التي ظهرت","Problems found")}</th><th>${X("التوصيات","Recommendations")}</th></tr>${V.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.hospital)}</b><br><small>${fmtD(x.visit_date)}</small></td><td>${X("د. ","Dr. ")}${esc(x.doctor_name)}</td><td style="white-space:pre-wrap">${esc(x.activities)}</td><td style="white-space:pre-wrap">${esc(x.problems||"—")}</td><td style="white-space:pre-wrap">${esc(x.recommendations||"—")}</td></tr>`).join("")}</table>`:`<p>${X("لا توجد زيارات مسجلة في هذه الفترة.","No visits logged in this period.")}</p>`}
  <p style="display:flex;justify-content:space-between;margin-top:26px"><span>${X("توقيع رئيس القسم:","Head of Department signature:")} ................</span><span>${X("التاريخ:","Date:")} ....../....../20....</span></p></div>`;
  $("rprint").onclick=()=>window.print();$("rback").onclick=()=>{helpTab=3;stTab=2;help(v)};
}

function showReg(){$("shell").classList.add("hide");$("reg").classList.remove("hide");$("rM").innerHTML="";$("rn").value=profile?profile.full_name:"";$("rp").value=profile&&profile.phone||"";$("rc").value=profile&&profile.student_code||""}
function enter(){$("reg").classList.add("hide");$("shell").classList.remove("hide");applyUI();route();
  sb.rpc("register_visit").then(({data,error})=>{if(!error&&data!=null)$("vc").textContent=Number(data).toLocaleString(lang==="ar"?"ar-EG":"en-US")})}
$("rlogo").src=LOGO;
$("rB").onclick=async()=>{const full_name=$("rn").value.trim();
  if(!full_name){$("rM").innerHTML=`<div class="msg err">${X("اكتب اسمك بالكامل","Enter your full name")}</div>`;return}
  if(!user){$("rM").innerHTML=`<div class="msg err">${X("فعّل Allow anonymous sign-ins من Supabase","Enable “Allow anonymous sign-ins” in Supabase")}</div>`;return}
  const row={id:user.id,full_name,phone:$("rp").value.trim()||null,student_code:$("rc").value.trim()||null};
  $("rB").disabled=true;const {error}=await sb.from("profiles").upsert(row);$("rB").disabled=false;
  if(error){$("rM").innerHTML=`<div class="msg err">${X("تعذر الحفظ: ","Could not save: ")}${esc(error.message)}</div>`;return}
  profile=row;enter()};
(async()=>{applyUI();
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(!r.error)session=r.data.session}
  user=session?session.user:null;
  if(!user){showReg();$("rM").innerHTML=`<div class="msg err">${X("فعّل Allow anonymous sign-ins من Supabase ثم Authentication ثم Sign In / Providers","Enable “Allow anonymous sign-ins” in Supabase → Authentication → Sign In / Providers")}</div>`;return}
  const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();profile=data;profile?enter():showReg()})();

</script>
